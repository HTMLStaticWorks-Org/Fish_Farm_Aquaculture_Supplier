<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | AquaHarvest Aquaculture Supplier</title>
  <link rel="icon" href="assets/images/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">

  <!-- RTL & Theme Toggle Outside the Card at Top Right Corner -->
  <div class="auth-top-tools">
    <button class="tool-btn" id="rtlToggle" title="Toggle RTL/LTR" aria-label="Toggle RTL">RTL</button>
    <button class="tool-btn" id="themeToggle" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">◐</button>
  </div>

  <main class="auth-shell">
    <div class="auth-card">
      <!-- Brand Inside the Card Aligned Center -->
      <a class="brand auth-brand" href="index.html">
        <span class="brand-mark">≈</span>
        <span>Aqua<span>Harvest</span></span>
      </a>

      <span class="eyebrow" style="text-align: center; display: block;">AQUAHARVEST ACCOUNT</span>
      <h1>Reset Password</h1>
      <p class="muted">Enter your registered email and we'll send a secure password reset link.</p>

      <form class="auth-form" onsubmit="event.preventDefault();alert('Password reset link sent to your email! (Demo mode)');location.href='login.html';">
        <label>
          Email address
          <input type="email" required placeholder="farmer@aquafarm.com">
        </label>
        <button class="btn dark full" type="submit">Send reset link ↗</button>
      </form>

      <p class="auth-switch"><a href="login.html">← Return to sign in</a></p>

      <div class="auth-social">
        <small>OR CONTINUE WITH</small>
        <div class="auth-social-buttons">
          <button type="button" class="btn-social" aria-label="Continue with Google">

            Continue with Google
          </button>
          <button type="button" class="btn-social" aria-label="Continue with Apple">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.92-2.88-.9.04-1.99.6-2.63 1.35-.57.65-1.07 1.72-.94 2.76 1.01.08 2.03-.49 2.65-1.23z"/></svg>
            Continue with Apple
          </button>
          <button type="button" class="btn-social" aria-label="Continue with Facebook">
            <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Continue with Facebook
          </button>
        </div>
      </div>
    </div>
    <p class="auth-copy">© 2026 AquaHarvest. Growing better aquaculture, together.</p>
  </main>

  <script src="assets/js/site.js"></script>

</html>
